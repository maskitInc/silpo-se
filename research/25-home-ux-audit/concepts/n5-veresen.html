<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>N5 · UI — СільпоSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

    <div class="phone">

      <div class="metrics3">

          <p class="metric">0/5</p>
          <p class="cap">заняття</p>

        <div class="mcell">
          <p class="metric" style="font-size:22px">1 549</p>
          <p class="cap">ккал</p>
        </div>
        <div class="mcell">
          <p class="metric" style="font-size:22px">5 161</p>
          <p class="cap">₴ лиш.</p>
        </div>
      </div>

      <article class="tile">
        <p class="cap">бюджет · 838 з 6 000</p>
        <div class="bar" aria-hidden="true"><i></i></div>
      </article>

      <div class="dock" style="margin-top:8px">
        <a class="btn btn--leaf btn--block" href="#">Пігнали</a>
        <a class="btn btn--ink btn--block" href="#">Замовити</a>

      <p class="foot">N5 · UI</p>
