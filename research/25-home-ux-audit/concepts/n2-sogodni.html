<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>N2 · UI — СільпоSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./mock.css" />
  </head>
  <body>
    <div class="phone">
      <header class="nav">
        <p class="brand">Сільпо<span>SE</span></p>
        <span class="chip">підключено</span>
      </header>
      <p class="sub">11 вер · сьогодні</p>

      <article class="tile tile--grow">
        <p class="k">СільпоSport</p>
        <div class="row">
          <div>
            <h1 class="h">Військові</h1>
            <p class="cap">початковий</p>
          </div>
          <div class="ring">28′</div>
        </div>
        <div class="chips">
          <div class="chip-meal"><b>Сн</b>яйця</div>
          <div class="chip-meal"><b>Об</b>курка</div>
          <div class="chip-meal"><b>Ве</b>салат</div>
        </div>
        <a class="btn btn--leaf btn--block" href="#">Пігнали ↗</a>
      </article>

      <article class="tile">
        <div class="row">
          <div>
            <p class="k">Express</p>
            <p class="metric metric--sm">5 161</p>
            <p class="cap">₴ до орієнтира</p>
          </div>
          <a class="btn btn--ink" href="#">Замовити</a>
        </div>
      </article>
      <p class="foot">N2 · UI</p>
    </div>
  </body>
</html>
