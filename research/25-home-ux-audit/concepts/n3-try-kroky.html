<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>N3 · UI — СільпоSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./mock.css" />
  </head>
  <body>
    <div class="phone">
      <header class="nav">
        <p class="brand">Сільпо<span>SE</span></p>
        <span class="chip">підключено</span>
      </header>
      <p class="sub">сесія → страви → кошик</p>

      <div class="steps">
        <div class="step step--on">
          <span class="n">1</span>
          <div style="flex:1">
            <p class="h">Сесія</p>
            <p class="cap">0/5 · цей місяць</p>
          </div>
          <a class="btn btn--leaf" href="#" style="padding:12px 14px">Пігнали</a>
        </div>
        <div class="step">
          <span class="n">2</span>
          <div style="flex:1">
            <p class="h">Страви</p>
            <div class="chips" style="margin-top:8px">
              <div class="chip-meal" style="padding:8px"><b>Сн</b></div>
              <div class="chip-meal" style="padding:8px"><b>Об</b></div>
              <div class="chip-meal" style="padding:8px"><b>Ве</b></div>
            </div>
          </div>
        </div>
        <div class="step">
          <span class="n">3</span>
          <div style="flex:1">
            <p class="h">Кошик</p>
            <p class="cap">5 161 ₴ лишилось</p>
          </div>
          <a class="btn btn--ink" href="#" style="padding:12px 14px">Замовити</a>
        </div>
      </div>
      <p class="foot">N3 · UI</p>
    </div>
  </body>
</html>
