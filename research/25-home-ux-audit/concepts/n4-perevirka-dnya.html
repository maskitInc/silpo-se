<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>N4 · UI — СільпоSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./mock.css" />
  </head>
  <body>
    <div class="phone">
      <header class="nav">
        <p class="brand">Сільпо<span>SE</span></p>
        <span class="chip">підключено</span>
      </header>
      <p class="sub">сьогодні</p>

      <article class="tile">
        <div class="check-row">
          <span class="circle"></span>
          <div style="flex:1">
            <p class="h" style="font-size:22px">Тренування</p>
            <p class="cap">0/5</p>
          </div>
          <a class="btn btn--leaf" href="#" style="padding:12px 14px">Пігнали</a>
        </div>
      </article>

      <article class="tile">
        <div class="check-row">
          <span class="circle"></span>
          <div style="flex:1">
            <p class="h" style="font-size:22px">Страви</p>
            <p class="cap">у списку</p>
          </div>
        </div>
        <div class="chips">
          <div class="chip-meal"><b>Сн</b>яйця</div>
          <div class="chip-meal"><b>Об</b>курка</div>
          <div class="chip-meal"><b>Ве</b>салат</div>
        </div>
      </article>

      <article class="tile">
        <div class="row">
          <div>
            <p class="metric metric--sm">5 161</p>
            <p class="cap">₴ · орієнтир</p>
          </div>
          <a class="btn btn--ink" href="#">Замовити</a>
        </div>
      </article>
      <p class="foot">N4 · UI</p>
    </div>
  </body>
</html>
