<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=400" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --peach: #f6e6dc;
      --peach-card: #f3ddd2;
      --coral: #e86a4a;
      --ink: #2a2420;
      --muted: #7a6f68;
      --cream: #faf4ee;
      --well: #2f3d35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e8ddd4;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 340px;
      background: linear-gradient(165deg, #f8ebe3 0%, var(--peach-card) 100%);
      border-radius: 28px;
      padding: 18px 16px 14px;
      box-shadow: 0 10px 28px rgba(60, 40, 30, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .head img.dumbbell {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.12));
    }
    .head h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .today {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 10px;
      align-items: center;
      padding: 12px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .today .kicker {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--coral);
      letter-spacing: 0.02em;
    }
    .today .name {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.05;
    }
    .today .dose {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .art-well {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: var(--well);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .art-well img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      /* white line art on transparent → keep white on dark well (live guide style) */
    }
    .progress {
      display: grid;
      gap: 6px;
    }
    .progress .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 14px;
      font-weight: 700;
    }
    .progress .row span:last-child {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--coral);
      border-radius: inherit;
    }
    .cta {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 14px 16px;
      background: var(--coral);
      color: #fff;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <article class="card" id="sport-card">
    <header class="head">
      <!-- simple SVG dumbbell mark (not exercise art) -->
      <svg class="dumbbell" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f08a6a"/>
            <stop offset="100%" stop-color="#d4553a"/>
          </linearGradient>
        </defs>
        <rect x="8" y="22" width="10" height="20" rx="3" fill="url(#g)"/>
        <rect x="46" y="22" width="10" height="20" rx="3" fill="url(#g)"/>
        <rect x="16" y="28" width="32" height="8" rx="3" fill="url(#g)"/>
      </svg>
      <h1>Спорт</h1>
    </header>

    <section class="today" aria-label="Сьогодні">
      <div>
        <p class="kicker">Сьогодні</p>
        <p class="name">Планка</p>
        <p class="dose">20 с × 3 · ~12 хв</p>
      </div>
      <div class="art-well">
        <img src="./plank-guide-frame-1.png" alt="Планка" width="512" height="512" />
      </div>
    </section>

    <div class="progress">
      <div class="row"><span>2/5 занять</span><span>лишилось 3</span></div>
      <div class="bar" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="5"><i></i></div>
    </div>

    <button type="button" class="cta">Пігнали →</button>
  </article>
</body>
</html>
