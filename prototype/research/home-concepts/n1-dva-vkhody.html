<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>N1 · UI — СільпоSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./mock.css" />
  </head>
  <body>
    <div class="phone">
      <header class="nav">
        <p class="brand">Сільпо<span>SE</span></p>
        <span class="chip">підключено</span>
      </header>
      <p class="sub">тренування · список · кошик</p>

      <article class="tile tile--grow">
        <p class="k">СільпоSport</p>
        <div class="row">
          <div>
            <h1 class="h">Тренування</h1>
            <p class="cap">ціль місяця</p>
            <p class="metric">0/5</p>
          </div>
        </div>
        <a class="btn btn--leaf" href="#">Пігнали ↗</a>
      </article>

      <article class="tile tile--grow">
        <p class="k">СільпоExpress</p>
        <h1 class="h">Список</h1>
        <p class="cap">лишилось з 6 000 ₴</p>
        <p class="metric metric--sm">5 161</p>
        <a class="btn btn--ink" href="#">Замовити ↗</a>
      </article>
      <p class="foot">N1 · UI</p>
    </div>
  </body>
</html>
